site_name: Brickadia Modding Framework
site_description: Server-side Lua modding framework for Brickadia dedicated servers.
site_url: https://ty-lercox.github.io/brickadia-modding-framework/
repo_url: https://github.com/Ty-lerCox/brickadia-modding-framework
repo_name: Ty-lerCox/brickadia-modding-framework
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Status: status.md
  - Getting Started:
      - First Plugin: getting-started/first-plugin.md
      - Windows Install: install/windows.md
  - API:
      - Overview: api/index.md
      - API Registry: api/apis.md
      - Chat: api/chat.md
      - Commands: api/commands.md
      - Plugins: api/plugins.md
      - Players: api/players.md
      - Permissions: api/permissions.md
      - Server: api/server.md
      - World: api/world.md
      - Prefabs: api/prefabs.md
      - Vehicles: api/vehicles.md
      - Minigames: api/minigames.md
      - Timers: api/timers.md
      - Events: api/events.md
      - Audit: api/audit.md
      - Logging: api/logging.md
      - Health: api/health.md
      - Rate Limits: api/rate-limits.md
      - Compatibility: api/compatibility.md
      - Archives: api/archives.md
  - Validation:
      - Canary Contract: validation/canary-contract.md
