site_name: Brickadia Modding Framework
site_description: Server-side Lua modding framework for Brickadia dedicated servers.
site_url: https://ty-lercox.github.io/brickadia-modding-framework/
repo_url: https://github.com/Ty-lerCox/brickadia-modding-framework
repo_name: Ty-lerCox/brickadia-modding-framework
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Status: status.md
  - Changelog: changelog.md
  - Getting Started:
      - First Plugin: getting-started/first-plugin.md
      - Windows Install: install/windows.md
  - Examples:
